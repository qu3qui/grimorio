  # --- TypeScript (append under `repos:`) ---
  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
      - id: tsc
        name: tsc --noEmit
        entry: npx tsc --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
