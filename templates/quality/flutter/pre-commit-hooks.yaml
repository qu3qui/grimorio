  # --- Flutter / Dart (append under `repos:`) ---
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        types: [dart]
      - id: flutter-analyze
        name: flutter analyze
        entry: flutter analyze --no-pub
        language: system
        types: [dart]
        pass_filenames: false
