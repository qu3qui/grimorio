name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      SKIP: ktlint,detekt # run in the quality job with the JDK
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Format check (ktlint)
        run: ./gradlew ktlintCheck
      - name: Static analysis (detekt)
        run: ./gradlew detekt
      - name: Android Lint (warnings as errors)
        run: ./gradlew lintDebug
      - name: Unit tests + coverage
        run: ./gradlew testDebugUnitTest koverXmlReportDebug koverVerifyDebug
      - name: Build
        run: ./gradlew assembleDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7

  # Private repos (no CodeQL): Semgrep CE. Public repos: drop this and enable CodeQL default setup.
  # Actions are pinned to commit SHAs (Semgrep flags mutable tags); Dependabot keeps them updated.
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # exported_activity: the launcher activity must be exported (MAIN/LAUNCHER intent filter).
      - run: semgrep scan --config auto --error --exclude-rule java.android.security.exported_activity.exported_activity
